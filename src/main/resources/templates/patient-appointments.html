<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fc;
            min-height:100vh;
        }

        .navbar{
            background:linear-gradient(to right,#0d6efd,#0dcaf0);
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
            font-size:24px;
        }

        .appointment-card{

            border:none;
            border-radius:20px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            overflow:hidden;
        }

        .page-title{

            color:#0d6efd;
            font-weight:bold;
        }

        .table thead{

            background:#0d6efd;
            color:white;
        }

        .table tbody tr:hover{

            background:#f1f5ff;
            transition:0.3s;
        }

        .badge{

            padding:8px 14px;
            border-radius:20px;
            font-size:14px;
        }

        .empty-box{

            text-align:center;
            padding:50px;
        }

        .empty-icon{

            font-size:70px;
            color:#adb5bd;
        }

        .btn-book{

            border-radius:12px;
            font-weight:bold;
            padding:10px 20px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand">

            <i class="bi bi-heart-pulse-fill"></i>

            Digital Healthcare

        </a>

        <div>

            <a href="/logout"
               class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title">
            My Appointments
        </h2>
        <a href="/patient/appointment/book"
           class="btn btn-primary btn-book">
            <i class="bi bi-calendar-plus"></i>
            Book Appointment
        </a>

    </div>
    <div class="card appointment-card p-4">
        <div th:if="${#lists.isEmpty(appointments)}"
             class="empty-box">
            <i class="bi bi-calendar-x empty-icon"></i>
            <h4 class="mt-3 text-muted">
                No Appointments Found
            </h4>
            <p class="text-muted">
                You have not booked any appointments yet.
            </p>

        </div>
        <div th:unless="${#lists.isEmpty(appointments)}"
             class="table-responsive">
            <table class="table table-hover align-middle">


                <thead>

                <tr>
                    <th>Doctor</th>
                    <th>Appointment Date</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="a : ${appointments}">
                    <td>
                        <i class="bi bi-person-badge-fill text-primary"></i>
                        <span th:text="${a.doctorName}"></span>
                    </td>

                    <td th:text="${a.appointmentDate}"></td>
                    <td>

                        <span class="badge"
                              th:classappend=
                                      "${a.status.name() == 'APPROVED'} ? 'bg-success' :
                               (${a.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning')"
                              th:text="${a.status}">
                        </span>

                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>


</body>
</html>
