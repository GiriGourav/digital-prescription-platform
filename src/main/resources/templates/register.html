<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body{
            background:linear-gradient(to right,#198754,#20c997);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .register-card{
            width:450px;
            border:none;
            border-radius:25px;
            padding:40px;
            background:white;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }
        .logo-icon{
            font-size:60px;
            color:#198754;
        }
        .title{
            font-weight:bold;
            color:#198754;
        }
        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }
        .btn-register{
            border-radius:12px;
            padding:12px;
            font-weight:bold;
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill logo-icon"></i>
        <h2 class="title mt-3">
            Create Account
        </h2>


        <p class="text-muted">
            Register to access healthcare services
        </p>
    </div>


    <form th:action="@{/register}"
          th:object="${user}"
          method="post">
        <div class="mb-3">
            <input type="text"
                   th:field="*{name}"
                   placeholder="Full Name"
                   class="form-control">
        </div>
        <div class="mb-3">
            <input type="email"
                   th:field="*{email}"
                   placeholder="Email Address"
                   class="form-control">

        </div>

        <div class="mb-3">
            <input type="password"
                   th:field="*{password}"
                   placeholder="Password"
                   class="form-control">
        </div>

        <div class="mb-3">
            <select th:field="*{role}"
                    class="form-select">
                <option value="">
                    Select Role
                </option>

                <option value="PATIENT">
                    Patient
                </option>
                <option value="DOCTOR">
                    Doctor
                </option>
            </select>
        </div>


        <button type="submit"
                class="btn btn-success w-100 btn-register">
            Register
        </button>
    </form>
    <div class="bottom-text">

        <span class="text-muted">
            Already have an account?
        </span>

        <a href="/login">
            Login
        </a>
    </div>
</div>

</body>
</html>
