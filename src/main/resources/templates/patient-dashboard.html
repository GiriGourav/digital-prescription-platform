<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Patient Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


  <style>
    body
    {
        background:#f4f7fc;
    }
    .navbar
    {
        background:linear-gradient(to right,#198754,#20c997);
    }

    .navbar-brand
    {
        color:white !important;
         font-size:24px;
        font-weight:bold;
    }
    .dashboard-card
    {
        border:none;
        border-radius:20px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
        transition:0.3s;
    }


    .dashboard-card:hover
    {
        transform:translateY(-5px);
    }

    .icon-box
    {
        width:70px;
        height:70px;
        border-radius:50%;

        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;

        color:white;
        margin:auto;
    }

    .history-box
    {
        background:#0d6efd;
    }


    .logout-box
    {
        background:#dc3545;
    }

  </style>
</head>

<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand"
       href="/patient/dashboard">
       Patient Dashboard
    </a>


    <a href="/logout"
       class="btn btn-light">
      Logout
    </a>

    <a href="/patient/appointment/book"
       class="btn btn-success">
         Book Appointment
    </a>
    <a href="/patient/appointments"
       class="btn btn-primary">

       My Appointments
    </a>
  </div>


</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">


      <div class="card dashboard-card p-4 text-center">

        <div class="icon-box history-box mb-3">
          <i class="bi bi-file-medical"></i>
        </div>
         <h3>View Prescriptions</h3>
         <p>Access your complete prescription history.</p>

        <a href="/patient/prescriptions"
            class="btn btn-primary">
          View
        </a>

      </div>

      </div>

  </div>
</div>

</body>

</html>
