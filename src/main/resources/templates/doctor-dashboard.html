<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
          body
          {
            background:#f4f7fc;
         }
         .navbar
         {
            background:linear-gradient(to right,#0d6efd,#0dcaf0);
         }
        .navbar-brand
        {
             color:white !important;
            font-size:24px;
             font-weight:bold;
        }
        .dashboard-card
        {
            border:none;
            border-radius:20px;

            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            transition:0.3s;
        }
        .dashboard-card:hover
        {

            transform:translateY(-5px);
        }


        .icon-box{
            width:70px;
            height:70px;


            border-radius:50%;
            display:flex;
            align-items:center;

            justify-content:center;
            font-size:30px;
            color:white;
            margin:auto;
        }
        .create-box{
            background:#0d6efd;
        }
        .history-box{
            background:#198754;
        }
        .logout-box{

             background:#dc3545;
        }
        .dashboard-title{
            font-weight:bold;
            color:#0d6efd;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">

    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-heart-pulse-fill"></i>
            Digital Healthcare
        </a>

        <div>

            <a href="/logout"
               class="btn btn-danger">
                Logout
            </a>

        </div>
    </div>

</nav>

<div class="container mt-5">
    <h2 class="text-center mb-5 dashboard-title">
           Doctor Dashboard
    </h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card dashboard-card p-4 text-center">
                  <div class="icon-box create-box mb-3">
                      <i class="bi bi-file-earmark-plus"></i>
                </div>
                   <h4>Create Prescription</h4>
                <p>Create digital prescriptions for patients.</p>
                   <a href="/doctor/prescription/create"
                     class="btn btn-primary">
                    Create
                </a>
              </div>
          </div>

         <div class="col-md-4">


            <div class="card dashboard-card p-4 text-center">
                <div class="icon-box history-box mb-3">
                       <i class="bi bi-clock-history"></i>
                </div>

                <h4>Prescription History</h4>
                 <p>View all prescription records.</p>
                <a href="/doctor/prescriptions"

                     class="btn btn-success">
                    View History
                </a>
            </div>
        </div>


        <div class="col-md-4">

              <div class="card dashboard-card p-4 text-center">
                <div class="icon-box logout-box mb-3">
                    <i class="bi bi-box-arrow-right"></i>

                </div>
                     <h4>Logout</h4>
                   <p>Securely logout from the platform.</p>
                <a href="/logout"
                     class="btn btn-danger">
                       Logout
                </a>

            </div>
        </div>
    </div>


</div>

</body>
</html>
