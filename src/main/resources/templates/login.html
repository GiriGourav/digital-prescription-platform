<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body
        {
            background:linear-gradient(to right,#0d6efd,#0dcaf0);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            border:none;
            border-radius:25px;
            padding:40px;
            background:white;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }

        .logo-icon
        {
            font-size:60px;
             color:#0d6efd;
        }
        .title
        {
             font-weight:bold;
            color:#0d6efd;
        }

        .form-control
        {
            border-radius:12px;
            padding:12px;
        }


        .btn-login
        {

            border-radius:12px;
            padding:12px;
            font-weight:bold;
        }
        .bottom-text
        {
            text-align:center;
            margin-top:20px;
        }

    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-heart-pulse-fill logo-icon"></i>
        <h2 class="title mt-3">
            Welcome Back
        </h2>
        <p class="text-muted">
            Login to your healthcare dashboard
        </p>
    </div>


    <form th:action="@{/login}"
          method="post">
        <div class="mb-3">
            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   class="form-control">
        </div>
        <div class="mb-3">
            <input type="password"
                    name="password"
                   placeholder="Enter Password"
                   class="form-control">
        </div>

        <button type="submit"
                class="btn btn-primary w-100 btn-login">
                Login
        </button>
    </form>


    <div class="bottom-text">
        <span class="text-muted">
            Don't have an account?
        </span>

        <a href="/register">
            Register
        </a>
    </div>

</div>


</body>
</html>
