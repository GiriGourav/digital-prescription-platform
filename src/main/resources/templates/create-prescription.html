<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Create Prescription</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body
        {
            background:#f4f7fc;
            min-height:100vh;
        }

        .navbar
        {
            background:linear-gradient(to right,#0d6efd,#0dcaf0);
        }

        .navbar-brand
        {
            color:white !important;
            font-weight:bold;

            font-size:24px;
        }

        .form-card
        {
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .page-title{
            color:#0d6efd;
            font-weight:bold;
        }


        .form-control
        {
            border-radius:12px;
            padding:12px;
        }

        textarea{
            min-height:120px;
        }



        .btn-save
        {
            border-radius:12px;
            padding:12px;
            font-weight:bold;
        }

        .icon-box
        {
            width:80px;
            height:80px;
            border-radius:50%;
            background:#0d6efd;

            color:white;
            display:flex;
            align-items:center;

            justify-content:center;
            font-size:35px;
            margin:auto;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand">

            <i class="bi bi-heart-pulse-fill"></i>
            Digital Healthcare
        </a>



        <div>

            <a href="/logout"
               class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card p-5">
                <div class="text-center mb-4">


                    <div class="icon-box">
                        <i class="bi bi-file-earmark-medical"></i>

                    </div>

                    <h2 class="page-title mt-3">
                        Create Prescription
                    </h2>

                    <p class="text-muted">
                        Fill patient details and prescribe medicines.
                    </p>

                </div>
                <form th:action="@{/doctor/prescription/save}"
                      th:object="${prescription}"
                      method="post">

                    <div class="mb-3">
                        <label class="form-label">
                            Patient Name
                        </label>

                        <input type="text"
                               th:field="*{patientName}"
                               placeholder="Enter patient name"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Patient Email
                        </label>

                        <input type="email"
                               th:field="*{patientEmail}"
                               placeholder="Enter patient email"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Diagnosis
                        </label>

                        <input type="text"
                               th:field="*{diagnosis}"
                               placeholder="Diagnosis details"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Medicines
                        </label>

                        <textarea th:field="*{medicines}"
                                  placeholder="Prescribed medicines"
                                  class="form-control"
                                  required></textarea>

                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Additional Notes
                        </label>
                        <textarea th:field="*{notes}"
                                  placeholder="Doctor's notes"
                                  class="form-control"></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 btn-save">

                        <i class="bi bi-check-circle-fill"></i>
                        Save Prescription
                    </button>
                </form>

            </div>


        </div>

    </div>

</div>
</body>


</html>
